name: Standalone CI

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  go:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: ICU development headers
        run: sudo apt-get update && sudo apt-get install -y libicu-dev
      # Same as upstream Beads CI: the Go suite needs the dolt CLI on PATH under GITHUB_ACTIONS.
      - name: Install Dolt
        run: curl -fsSL https://github.com/dolthub/dolt/releases/latest/download/install.sh | sudo bash
      - name: Configure Git and Dolt identity
        run: |
          git config --global user.name "CI Bot"
          git config --global user.email "ci@example.invalid"
          dolt config --global --add user.name "CI Bot"
          dolt config --global --add user.email "ci@example.invalid"
      - name: Build
        run: go build -p 4 ./...
      - name: Build subprocess test CLI
        run: go build -p 4 -tags gms_pure_go -o "$RUNNER_TEMP/bd-test" ./cmd/bd
      - name: Test
        env:
          BEADS_TEST_BD_BINARY: ${{ runner.temp }}/bd-test
        run: go test -p 4 -timeout 30m ./...
  boards:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Board tests
        run: node --test --test-concurrency=4 boards/*.test.mjs
  mcp:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: ICU development headers
        run: sudo apt-get update && sudo apt-get install -y libicu-dev
      - uses: astral-sh/setup-uv@v6
      - name: Build CLI for MCP subprocess tests
        run: go build -p 4 -o "$RUNNER_TEMP/bd" ./cmd/bd && echo "$RUNNER_TEMP" >> "$GITHUB_PATH"
      - name: MCP tests
        run: uv run --directory integrations/beads-mcp pytest -q
  ui:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ui
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: ui/package-lock.json
      - run: npm ci
      - run: npm run build
      - run: npm test -- --maxWorkers=4
